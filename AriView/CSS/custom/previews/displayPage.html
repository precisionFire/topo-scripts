        <script>
		// JSON过滤
		function isValidJSON(str) {
			try {
				JSON.parse(str);
				return true;
			}catch(e) {
				return false;
			}
		}
		
		/**
		 * 控制流动管道动画的函数
		 * @param {number} [speedDirection=-3] - 流动速度方向和大小，正值向右流动，负值向左流动
		 */
		function startFlowAnimation(dm,speedDirection = -3) {
			let i = 1;
			setInterval(function() {
				ht.Default.startAnim({
					frames: 1,
					interval: 100,
					action: function(v, t) {
						i += speedDirection;
						dm.each(function(d) {
							if (d.getDisplayName() === '流动管道') {
								d.s('shape.dash.offset', i);
							}
						});
					}
				});
			}, 50);
		}
		
		/**
		 * 批量更新图扑中 ht.Text 节点的显示名称为 点位名称 + "+" + 原显示名
		 * @param {ht.DataModel} dm - 图扑的数据模型对象
		 * @param {Array} mappingArray - 映射数组，格式为：[[绑定ID, 点位名称], ...]
		 */
		function prependPointNameToDisplayName(dm, mappingArray) {
			if (!dm || !Array.isArray(mappingArray)) return;

			const idToNameMap = new Map(mappingArray);

			dm.getDatas().each(function (node) {
				if (node instanceof ht.Text) {
					const bindingId = node._dataBindings?.s?.text?.id;
					if (typeof bindingId === 'string') {
						const pointName = idToNameMap.get(bindingId);
						if (pointName) {
							const oldDisplayName = node.getDisplayName() || '';
							const newDisplayName = `${pointName}+${oldDisplayName}`;

							node.setDisplayName(newDisplayName);
							node.a('text', newDisplayName);  // 图上显示内容
						}
					}
				}
			});
		}

		//消息提示
		function showToast(message, duration = 1000) {
			const toast = document.createElement('div');
			toast.innerText = message;

			Object.assign(toast.style, {
				position: 'fixed',
				top: '30px', // 顶部显示
				left: '50%',
				transform: 'translateX(-50%)',
				background: 'linear-gradient(45deg, #1e90ff, #87cefa)', 
				color: '#fff',
				padding: '10px 24px',
				borderRadius: '6px',
				fontSize: '14px',
				zIndex: 9999,
				boxShadow: '0 2px 10px rgba(0, 0, 0, 0.3)',
				opacity: '1',
				transition: 'opacity 0.3s ease',
				pointerEvents: 'none',
				maxWidth: '80%',
				textAlign: 'center',
			});

			document.body.appendChild(toast);

			// 1秒后淡出
			setTimeout(() => {
				toast.style.opacity = '0';
				setTimeout(() => {
					toast.remove();
				}, 300); // 动画持续时间
			}, duration);
		}

		if (typeof tag === 'object') {
			let key = Object.keys(tag)[0]
			return tag[key]
		}
		if (typeof tag === 'string') return tag;
	}
	
	if (isValidJSON(tag)) {
		tagCode = JSON.parse(tag);
		tagCode = typeVar(tag);
	}
	
	tagCode = typeVar(tag);
	
	console.log(tagCode)
	
    {
        // 设计路径
          let url = window.location.origin + '/HistoricalDataDialog/newDataDialog.html?tag=' + encodeURI(encodeURI(tagCode)) + '&name=' + encodeURI(encodeURI(name)) + '&tagid=' + encodeURI(encodeURI(tagid));
		 const dialogTitle = name || "历史趋势";
        //let tag_ = "NumTag/WeightInFurFlat/扁钢称重/Flat_ Furnace_Weight1"
        // const url = `${window.location.origin}/HistoricalDataDialog/newDataDialog.html?tag=${encodeURI(encodeURI(tag_))}&name=${encodeURI(name)}`;
        openModalWithIframe(url, dialogTitle);

        function openModalWithIframe(url, title) {
            // 检查是否已存在模态框，存在则重用
            if (document.getElementById('myModal')) {
                document.getElementById('iframe').src = url;
                document.getElementById('myModalLabel').textContent = title;
                const modal = new bootstrap.Modal(document.getElementById('myModal'));
                  
                modal.show();
                return;
            }

            // 创建模态框HTML
            const modalHTML = `
          <div class="modal fade" id="myModal" tabindex="-1" aria-labelledby="myModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-xl">
              <div class="modal-content">
                <div class="modal-header" style="padding: 0.3rem 1rem;">
                  <h5 class="modal-title" id="myModalLabel">${title}</h5>
                 <!--  <span id="datetime" class="ms-3" style="font-size:16px;">--:--</span> -->
                 <!-- <button type="button" class="btn btn-sm btn-outline-secondary ms-2" id="fullscreenBtn">
                    <i class="bi bi-arrows-fullscreen"></i>
                  </button> -->
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭" style="font-size: 1rem;"></button>
                </div>
                <div class="modal-body" style="height:600px;padding-top: 0;padding-bottom:0;">
                  <iframe id="iframe" src="${url}" width="100%" height="100%" frameborder="0"></iframe>
                </div>
               <!-- <div id="resizer" style="width: 15px; height: 15px; position: absolute; right: 0; bottom: 0; cursor: se-resize;"></div> -->
              </div>
            </div>
          </div>
        `;

            // 添加模态框到DOM
            const container = document.createElement('div');
            container.innerHTML = modalHTML;
            document.body.appendChild(container);

            // 显示模态框
            const modal = new bootstrap.Modal(document.getElementById('myModal'));
            modal.show();
        }
    } 
}
                dataModel = new ht.DataModel();
                graphView = new ht.graph.GraphView(dataModel);

function changPage(url, callBack = undefined) {
            graphView.dm().clear()
            graphView.deserialize(url, function (json, dm, gv, datas) {
                callBack && callBack(json, dm, gv, datas)
            });
        }
           
		   function init() {
	graphView.enableToolTip();

                graphView.deserialize('previews/display.json', function(json, dm, gv, datas) {
		BindDataToPage(dataModel);		
                    if(json.title) document.title = json.title;
                    if (json.a['json.background']) {
                        var bgJSON = json.a['json.background'];
                        if (bgJSON.indexOf('displays') === 0) {
                            var bgGv = new ht.graph.GraphView();
                            bgGv.deserialize(bgJSON);
                            bgGv.addToDOM();
                            graphView.addToDOM(bgGv.getView());
                        }
                        else if (bgJSON.indexOf('scenes') === 0) {
                            var bgG3d = new ht.graph3d.Graph3dView();
                            bgG3d.deserialize(bgJSON);
                            bgG3d.addToDOM();
                            graphView.addToDOM(bgG3d.getView());
                        }
                        graphView.handleScroll = function() {};
                    }
                });
            } 
        </script>
