        lastDate = new Date(new Date(data.dt).setMinutes(new Date(data.dt).getMinutes() - data.timeLenght));
        for (let index = 0; index < chartlength; index++) {
          if (new Date(chartData[0].value[0]) <= lastDate) {
            chartData.shift();
          } else {
            break;
          }
        }
      } else {

    //获取当前实时数据

    function getRealtimeData() {
      var t = "testmq" + getRandomString(5),
        a = !1,
        e = !1;

      function i() {
        if (a = !0, console.log("连接服务器成功"), !e) {

          e = !0
        }
        window.onbeforeunload = function () {
          for (var t in _ListSubscribe) client.unsubscribe(t)
        }
      }

      function n() {
        a || client.connect({
          onSuccess: i,
          cleanSession: !1,
          useSSL: !1,
          keepAliveInterval: 30,
          timeout: 10
        })
      }
      client = new Paho.MQTT.Client("180.10.10.17", 8083, t), n(), setInterval(n, 8e3),
        client.onConnectionLost = function (t) {
          0 !== t.errorCode && (console.log("连接已断开"), a = !1)
        },
        client.onMessageArrived = function (t) {
          console.log(t)
          try {
            var a = t.destinationName;
            a in _ListSubscribe && (_ListSubscribe[a] = t.payloadString)
            pushNewData(t.payloadString)
          } catch (t) {
            console.log("ERROR1:" + t), console.log(a + ":" + value)
          }
        }
    }


    function getRandomString(t) {
      var s = "abacdefghjklmnopqrstuvwxyzABCDEFGHJKLMNOPQRSTUVWXYZ0123456789",
        a = s.length - 1,
        e = "";
      t = t || 15;
      for (var i, n = 0; n < t; n++) i = (i = function (t, a, e, i) {
        var n = Math.floor(Math.random() * (a - t + 1) + t);
        return n = 0 == e && s.length - 10 <= n ? i(t, a, e, i) : n
      })(0, a, n, i), e += s[i];
      return e
    }

      var timeTemp = new Date(new Date(date).setMinutes(new Date(date).getMinutes() - timeLength));
      document.getElementById("date0").value = timeTemp.getFullYear() + "-" + ((timeTemp.getMonth() + 1) > 9 ? (timeTemp.getMonth() + 1) : "0" + (timeTemp.getMonth() + 1)) + "-" + (timeTemp.getDate() > 9 ? timeTemp.getDate() : "0" + timeTemp.getDate());
      document.getElementById("time0").value = (timeTemp.getHours() > 9 ? (timeTemp.getHours()) : "0" + (timeTemp.getHours())) + ":" + (timeTemp.getMinutes() > 9 ? timeTemp.getMinutes() : "0" + timeTemp.getMinutes());
    }

    //时间选择变化
    function onChange() {
      document.getElementById("during").value = 0;
    }
    //下拉框选择
    function onSelect() {
      if (document.getElementById("during").value == "0")
        return;
      var date = document.getElementById("date").value;
      var time = document.getElementById("time").value;
      if (date && time) {
        date = date + " " + time;
      }
      var timeLength = getTimeLength(document.getElementById("during").value);
      var timeTemp = new Date(new Date(date).setMinutes(new Date(date).getMinutes() - timeLength));
      document.getElementById("date0").value = timeTemp.getFullYear() + "-" + ((timeTemp.getMonth() + 1) > 9 ? (timeTemp.getMonth() + 1) : "0" + (timeTemp.getMonth() + 1)) + "-" + (timeTemp.getDate() > 9 ? timeTemp.getDate() : "0" + timeTemp.getDate());
      document.getElementById("time0").value = (timeTemp.getHours() > 9 ? (timeTemp.getHours()) : "0" + (timeTemp.getHours())) + ":" + (timeTemp.getMinutes() > 9 ? timeTemp.getMinutes() : "0" + timeTemp.getMinutes());
    }

    //根据选择获取间隔分钟
    function getTimeLength(type) {
      var timeLenght = 0;
      switch (type) {
        case "0"://自定义
          timeLenght = 9999999;
          var beginTime = new Date(document.getElementById("date0").value + " " + document.getElementById("time0").value);
          var endTime = new Date(document.getElementById("date").value + " " + document.getElementById("time").value);
          timeLenght = (Number(endTime.getTime()) - Number(beginTime.getTime())) / 1000 / 60;//相差分钟数
          break;
        case "1":
          timeLenght = 10;
          break;
        case "2":
          timeLenght = 30;
          break;
        case "3":
          timeLenght = 60;
          break;
        case "4":
          timeLenght = 360;
          break;
        case "5":
          timeLenght = 720;
          break;
        case "6":
          timeLenght = 1440;
          break;
        case "7":
          timeLenght = 4320;
          break;
        case "8":
          timeLenght = 10080;
          break;
        default:
          break;
      }
      return timeLenght;
    }

    //修改月、天的格式，保持两位数显示
    function add0(m) {
      return m < 10 ? '0' + m : m
    }
    //获取地址栏参数
    function GetQueryString(name) {
      var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
      var r = window.location.search.substr(1).match(reg);
      if (r != null) return unescape(r[2]); return null;
    }
  </script>
